# Backend lint.
#
# Deliberately conservative: this gate catches real defects (undefined names,
# unused imports, bug-prone patterns), not style. It is not a formatter and does
# not police line length — churn from a linter is what makes people turn it off.

target-version = "py311"

# Invoke ruff so it can discover this file: either from backend/, or as
# `ruff check backend/` from the repo root. Both resolve first-party imports
# (orders, subscribers, config) correctly and agree.
#
# Passing `--config backend/ruff.toml` explicitly *while running from the repo
# root* does not — that changes how ruff resolves the project root, so
# `orders.views` stops counting as first-party and I001 fires on correctly
# sorted files. scripts/check.py runs from backend/ and never hits this.
#
# Do not add RUF012 (mutable-class-default): it fires on Django's declarative
# `permission_classes = [...]` / `fields = [...]` idiom, which is the framework's
# convention rather than shared mutable state.

[lint]
select = [
    "E4", # imports
    "E7", # statements
    "E9", # runtime errors (syntax-level breakage)
    "F",  # pyflakes: undefined names, unused imports/variables, f-string bugs
    "B",  # flake8-bugbear: mutable defaults, shadowed builtins, dead excepts
    "I",  # import sorting
]

# Not enabled on purpose:
#   RUF012 (mutable-class-default) — fires on Django's declarative class
#     attributes (`permission_classes = [...]`, `fields = [...]`,
#     `read_only_fields = [...]`). That is the framework's idiom, not shared
#     mutable state; annotating every one with ClassVar would be noise and less
#     idiomatic Django.
#   E501 (line-too-long) — formatting, not correctness.
#   UP (pyupgrade) — modernisation churn with no defect signal.

[lint.per-file-ignores]
# Migrations are generated by Django; lint only what we maintain by hand.
"*/migrations/*" = ["F", "I", "B"]
